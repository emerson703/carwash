server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:carwashdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

# ✅ CONFIGURACIÓN FEIGN (SOLO lo esencial)
feign:
  client:
    config:
      default:
        connectTimeout: 5000    # 5 segundos timeout de conexión
        readTimeout: 5000       # 5 segundos timeout de lectura
        loggerLevel: basic      # Logging básico para debugging

