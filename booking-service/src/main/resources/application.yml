eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

#  Opcional: Configuración de logging para debugging
logging:
  level:
    com.carwash.booking: DEBUG
    org.springframework.cloud.openfeign: DEBUG