spring.application.name:micro
# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:carwashdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# H2 Console (Acceso visual a la BD)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Opcional: Para evitar problemas de serialización con LAZY loading
spring.jackson.serialization.fail-on-empty-beans=false

eureka.client.serviceUrl.defaultZone: http://localhost:8761/eureka
eureka.client.instance.instance-id:${spring.application.name}:${server.port}
